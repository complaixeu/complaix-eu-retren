# .github/workflows/ci.yml
# Adapted from Complaix's ci.yml. DEV is the only deploy target.
#
#   verify          lint → typecheck → test → build, one job (one install).
#                   Runs on every non-draft PR and on push to develop.
#                   Uses placeholder env only: no secrets, safe for fork PRs.
#   security-audit  pnpm audit, non-blocking.
#   migrations      PRs + merge queue: migration order check, then a throwaway
#                   local Supabase (127.0.0.1 only) built from every migration,
#                   then the database (pgTAP) and integration tests against it.
#   e2e             PRs + merge queue: Playwright against a production build on
#                   127.0.0.1 and a local Supabase. Fake providers, no secrets.
#   migrate_dev     push to develop (or manual run on develop) → supabase db push to DEV.
#   deploy_dev      after migrate_dev → vercel build + deploy --prebuilt
#                   (Preview target, never --prod) → /api/health smoke check.
#
# migrate_dev and deploy_dev use the `development` GitHub Environment, which
# only the develop branch can deploy to. Until its secrets exist they skip
# with a notice instead of failing.
#
# Public repo: never add `pull_request_target`, and never print env, pulled
# Vercel files or connection strings — run logs are public.

name: CI

permissions:
  contents: read

# For now `develop` is the only working branch; `main` is frozen (see CLAUDE.md §2).
on:
  push:
    branches: [develop]
    # Docs-only pushes don't redeploy DEV.
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: [develop]
    # Draft PRs run nothing; marking ready runs CI once. No paths-ignore here:
    # `verify` is a required check, so it must report on every PR.
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue: each PR is re-checked on top of develop + the PRs ahead of it.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A newer push to the same PR cancels the older run. Every other run (push to
# develop, merge queue, manual) gets its own group, so none cancels another;
# migrate_dev and deploy_dev serialise themselves with job-level groups.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  SUPABASE_CLI_VERSION: "3.1.0" # keep equal to package.json devDependency
  VERCEL_CLI_VERSION: "65.16.0"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  security-audit:
    name: pnpm audit (prod deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  migrations:
    name: Migrations (local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: New migrations are newer than everything on develop
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash scripts/check-migration-order.sh "$BASE_SHA"
      - name: Build a throwaway local Supabase from every migration
        run: bash scripts/supabase-local.sh start
      - name: supabase db push (same command as migrate_dev, local target)
        run: pnpm exec supabase db push --yes
      - name: Database tests (pgTAP)
        run: pnpm test:db
      - name: Integration tests (local Supabase, fake providers)
        run: pnpm test:integration
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: Build a throwaway local Supabase from every migration
        run: bash scripts/supabase-local.sh start
      # Builds the app, serves it on 127.0.0.1 and drives it with fake providers only.
      - name: Interface tests (Playwright)
        run: pnpm test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true

  migrate_dev:
    name: Apply DB migrations (dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [verify]
    # push to develop, or a manual run (Actions → CI → Run workflow) on develop.
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: development
    # One DEV migration at a time, in push order.
    concurrency:
      group: migrate-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Supabase DEV secrets not set in the 'development' environment; skipping migrations."
            exit 0
          fi
          supabase db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

  deploy_dev:
    name: Deploy dev to Vercel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [migrate_dev]
    # push to develop, or a manual run (Actions → CI → Run workflow) on develop.
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: development
    # One dev deploy at a time, in push order.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel secrets not set in the 'development' environment; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.ready == 'true'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Vercel CLI
        if: steps.check.outputs.ready == 'true'
        run: npm install -g "vercel@${VERCEL_CLI_VERSION}"
      # Writes .vercel/.env.preview.local on the runner. Never print it.
      - name: Pull Vercel env (Preview, develop branch)
        if: steps.check.outputs.ready == 'true'
        run: vercel pull --yes --environment=preview --git-branch=develop --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy (Preview target — never --prod)
        if: steps.check.outputs.ready == 'true'
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      # DEV only. Vercel assigns a project's *first* deployment to production even
      # without --prod (it happened on 2026-11-14). Ask the API which target this
      # deployment really got and fail loudly if it is production.
      - name: Guard — fail if the deployment is production
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          host="${URL#https://}"
          target="$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${host}?teamId=${VERCEL_ORG_ID}" | jq -r '.target // "preview"')"
          echo "Vercel target: $target"
          if [ "$target" = "production" ]; then
            echo "::error::This deployment was assigned to PRODUCTION. ReTren is DEV-only. Tell Nestor Gomez Artiles; do not retry."
            exit 1
          fi
      # Optional stable URL, e.g. retren-dev.vercel.app (repo/env variable DEV_ALIAS).
      - name: Alias
        if: steps.check.outputs.ready == 'true' && vars.DEV_ALIAS != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
          DEV_ALIAS: ${{ vars.DEV_ALIAS }}
        run: |
          vercel alias set "$URL" "$DEV_ALIAS" --token="$VERCEL_TOKEN"
          echo "Alias: https://$DEV_ALIAS" >> "$GITHUB_STEP_SUMMARY"
      # Preview URLs sit behind Vercel Authentication by default. With the
      # optional VERCEL_AUTOMATION_BYPASS_SECRET the check gets through;
      # without it a 401 is reported as a warning, not a failure.
      - name: Smoke check /api/health
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5 6; do
            if [ -n "$BYPASS" ]; then
              status=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $BYPASS" "$URL/api/health" || true)
            else
              status=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health" || true)
            fi
            echo "Attempt $attempt: $status"
            [ "$status" = "200" ] && exit 0
            if [ "$status" = "401" ] && [ -z "$BYPASS" ]; then
              echo "::warning::Deployment is protected (401). Set VERCEL_AUTOMATION_BYPASS_SECRET to smoke-check it."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke check failed: /api/health returned $status"
          exit 1
